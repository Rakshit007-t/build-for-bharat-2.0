<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghost Skills</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans antialiased">
  <main class="text-center p-8 max-w-lg mx-auto">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 mb-6 border border-indigo-500/20 text-3xl">
      👻
    </div>
    <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">
      Ghost Skills
    </h1>
    <p class="mt-3 text-slate-400 text-sm leading-relaxed">
      AI skill verification layer for hiring. Verify claimed candidate abilities through resume evidence and adaptive testing.
    </p>
    <div class="mt-6 inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs text-slate-400">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      System scaffold initialized
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
